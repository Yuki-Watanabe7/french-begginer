# 家庭内本番の入口（compose.production.yml / Issue #219）。
# React のビルド結果を配信し、/api と /health を同一オリジンで backend へ中継する。
# Host / Origin の検証は backend の request guard が行うため、Host は書き換えずに渡す。

# hash 付き assets は長期 cache、index.html などは毎回再検証する（更新後の再読込で古い画面を出さない）
map $uri $french_cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    default    "no-cache";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 音声取り込みの上限 25 MB + multipart の余白
    client_max_body_size 26m;

    add_header Cache-Control $french_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # backend だけ作り直すと IP が変わる。起動時の IP に中継し続けて 502 にならないよう、
    # Docker の内部 DNS で引き直す。変数の proxy_pass は URI を付けないので /api のパスを保つ
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # LLM 抽出・文字起こしは数十秒かかることがある
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
